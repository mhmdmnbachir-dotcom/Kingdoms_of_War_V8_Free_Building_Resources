
name: Build Kingdoms of War V8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Check project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f main.gd
          echo "Project files found"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" KingdomsOfWar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kingdoms-of-War-V8-APK
          path: KingdomsOfWar.apk
          if-no-files-found: error
          
